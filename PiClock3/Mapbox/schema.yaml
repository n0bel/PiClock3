description: >
  Mapbox's static map, as the picture under a radar.  It arrives with
  Mapbox's own logo and credit drawn into it, and sends a mask saying where
  they sit so whatever draws over it can put them back on top.

provides: [map]

settings:

  apikey:
    is: apikey
    required: true
    help: Your Mapbox access token, usually {apikeys.mbapi} to take it
      from ApiKeys.yaml.
  style:
    is: string
    help: The Mapbox style drawn, such as mapbox/satellite-streets-v10 or
      one of your own from Mapbox Studio.  A radar's own style wins over
      this.
