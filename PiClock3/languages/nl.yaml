code: [nl]

name: Dutch

# LC_TIME names this language answers to, tried in order.  The
# spelling differs between platforms, and a glibc system has to
# have generated it (sudo dpkg-reconfigure locales), so several
# are offered and the first one that takes is used.
locale: [nl_NL.UTF-8, nl_NL]

strings:
  pressure: Luchtdruk
  humidity: Vochtigheid
  wind: Wind
  gusting: buien
  feels_like: GevoelsT.
  sunrise: Zon op
  sunset: Zon onder
  moon_phase: Maanstand
  new_moon: Nieuwe maan
  waxing_crescent: Wassende sikkel
  first_quarter: Eerste kwartier
  waxing_gibbous: Wassende maan
  full_moon: Volle maan
  waning_gibbous: Afnemende maan
  last_quarter: Laatste kwartier
  waning_crescent: Afnemende sikkel
  today: vandaag

# Lmoon1 = 'nieuwe maan'
# Lmoon2 = 'jonge maan'
# Lmoon3 = 'eerste kwartier'
# Lmoon4 = 'wassende maan'
# Lmoon5 = 'volle maan'
# Lmoon6 = 'afnemende maan'
# Lmoon7 = 'laatste kwartier'
# Lmoon8 = 'asgrauwe maan'


# Conditions, as WMO code table 4678 - METAR present-weather notation.
# The key is the notation a provider reports; the comment is WMO's own
# English, which is a technical gloss rather than something to put on a
# screen, so every language including English is a translation of it.
#
# Nothing has to be complete.  A notation with no entry falls back to a
# less specific one - -SHRA to SHRA to RA - so a language is useful from
# its first dozen lines.

conditions:
# sky cover - a separate METAR group, not in 4678
  'CAVOK':  Heldere hemel                        # ceiling and visibility OK
  'SKC':    Heldere hemel                        # sky clear, 0 oktas
  'CLR':    Heldere hemel                        # no cloud below 12 000 ft
  'NCD':    Heldere hemel                        # no cloud detected
  'NSC':    Overwegend helder                    # no significant cloud
  'FEW':    Overwegend helder                    # few, 1 to 2 oktas
  'SCT':    Half bewolkt                         # scattered, 3 to 4 oktas
  'BKN':    Overwegend bewolkt                  # broken, 5 to 7 oktas
  'OVC':    Volledig bewolkt                     # overcast, 8 oktas
  'VV':     Hemel onzichtbaar                    # vertical visibility, sky obscured
# phenomena that only occur under a descriptor
  'GR':     Hagel                                   # hail
  'GS':     Sneeuwhagel                            # small hail and/or snow pellets
  'SH':     Buien                                  # shower(s)
# WMO code table 4678, present weather
  'BR':     Dunne mist                             # Mist
  'DS':     Stofstorm                              # Duststorm
  '+DS':    Hevige stofstorm                      # Heavy duststorm
  '-DS':    Lichte stofstorm                      # Light duststorm
