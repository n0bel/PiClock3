name: Meridian
description: The sun's daily circle over the pole, in ice blue on near-black

# The background is drawn rather than photographed: the sun's daily circle
# over the pole, the horizon it crosses only twice a year, a spoke for every
# hour, and the emperors standing on it.
background: '{this-folder}/background.png'

# art the shipped plugins carry; a theme picks which set
kind-settings:
  analog-clock:       {clock-images-folder: lightblue}
  current-conditions: {icons-folder: icons-lightblue}
  forecast:
    icons-folder: icons-lightblue
    # the cells lie along the foot rather than down a column, so they are
    # about twice the height of a column cell - and a fraction of height
    # that suits one is too big for the other
    layout:
      wx:          {font-size: 0.13}
      day:         {font-size: 0.11}
      # the credit shares the last cell with its day, so it takes the
      # left half and leaves the right
      attribution: {font-size: 0.09, width: 0.5, align: left-top}
  # the face is drawn over the diagram's middle, so it stays quiet
  digital-clock:      {color: '#cfeeff', font-weight: normal}

default:
  font-size: 0.019       # a fraction of the screen height
  font-family: Arial
  background-color: transparent
  color: '#8fd6ee'

borders:
  # frame.png is a solid rule, not a glow, so it has a hard inner edge and
  # content sits right against it - that is what inset: 1.0 is for.  width is
  # a fraction of screen height, so it stays a hairline on any screen.
  default:
    art: '{this-folder}/frame.png'
    width: 0.0035
    inset: 1.0
  radar:
    art: '{this-folder}/frame.png'
    width: 0.0035
    inset: 1.0

styles:
  # the date rides above the diagram, so it is given room and a little air
  date:
    font-size: 0.5
    qproperty-alignment: AlignCenter
