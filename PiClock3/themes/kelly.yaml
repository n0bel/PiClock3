name: Kelly
description: The kelly background

background: '{folders.image}/clockbackground-kelly.png'

values:
  icons: icons-lightblue
  clockface: lightblue

default:
  font-size: 0.02        # a fraction of the screen height
  font-family: Arial
  background-color: transparent
  color: '#bef'

borders:
  default:
    image: '{folders.image}/bb2.png'
    slice: [10, 5, 10, 5]   # pixels into the art, not the screen
    first: [5, 5, 10, 5]    # first cell of a repeat
    last:  [10, 5, 5, 5]    # last cell
  radar:
    image: '{folders.image}/bb1.png'
    slice: [10, 5, 10, 5]   # pixels into the art, not the screen
    first: [5, 5, 10, 5]    # first cell of a repeat
    last:  [10, 5, 5, 5]    # last cell

styles:
  centered:
    qproperty-alignment: AlignCenter
  date:
    font-size: 0.75
    qproperty-alignment: AlignCenter
  bottom:
    font-size: 0.5
    qproperty-alignment: AlignCenter
