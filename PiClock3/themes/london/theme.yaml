name: London
description: The Thames at night, light-blue clock

# The background is "London Skyline" by Sushant Sakhalkar, from Wikimedia
# Commons, released under CC0 1.0 Universal - a public domain dedication, so
# nothing here needs crediting and nothing is owed.  It is recorded anyway,
# because knowing where a file came from is worth more than the licence
# demands:
#   https://commons.wikimedia.org/wiki/File:London_Skyline_(199638369).jpeg
# Cropped from 2048x1365 to 1440x900; nothing else was changed.
background: 'background.png'

# art sets the plugins ship; a theme picks which
clock-art:     lightblue
weather-icons: icons-lightblue

default:
  font-size: 0.02        # a fraction of the screen height
  font-family: Arial
  background-color: transparent
  color: '#bef'

borders:
  # a 3x3 sheet, so the slice is a third of it - the art describes its own
  # geometry and this file cannot disagree with it.  width is a fraction of
  # screen height, so a frame is the same weight on a small box as on a big
  # one, and the same at 800x600 as at 1920x1080.
  default:
    art: 'frame.png'
    width: 0.012
    inset: 0.5
  radar:
    art: 'frame.png'
    width: 0.012
    inset: 0.5

styles:
  centered:
    font-size: 0.6
    qproperty-alignment: AlignCenter
  date:
    font-size: 0.75
    qproperty-alignment: AlignCenter
  bottom:
    font-size: 0.5
    qproperty-alignment: AlignCenter
