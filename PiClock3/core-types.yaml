# The types nobody owns - the shapes more than one plugin needs.  A plugin
# invents its own beside its settings; these are the ones invented for
# everybody, and a name may not be redefined.
#
# Four kinds, which is what a type is made of:
#
#     scalar   a string, a number, a boolean
#     block    an object whose keys are known    marker {location, color}
#     table    an object whose keys you invent   widgets {radar1, radar2}
#     list     an array
#
# A setting says one of:
#
#     is: <type>          exactly this
#     of: [<type>, ...]   any one of these types
#     with: <type>        that type's fields sit beside these, not under
#
# and may add:
#
#     one-of: [v, ...]    these values, and nothing else
#     required: true      must be set; blank is a problem
#     inherits: <where>   blank takes it from there
#     range: [low, high]  inclusive
#     unit: <what>        what a bare number counts - minutes, milliseconds
#     quantity: <what>    an entry in units/quantities.yaml: a bare number
#                         is its base, and any unit it lists may be written
#     pattern: <what>     a string the clock reads with an expression
#                         rather than takes as it stands.  Named rather
#                         than written out, so the clock and a check read
#                         it with the same one: geometry
#     names: <what>       must name something that exists, which is what
#                         lets an editor offer a list rather than a box:
#
#         providers   an entry of the config's own providers:
#         regions     one a page's layout declares, cells included
#         layouts     one of the folders a layout is looked for in
#         themes      the same, for a theme
#         unit-sets   a set in units/sets.yaml, or one added to it
#         languages   a file in languages/
#         timezones   a zone this machine has, blank being its own
#
#                         Those are the ones this file knows how to list.
#                         A plugin's own art is not, so a block names the
#                         folder instead, in the plugin's own settings:
#
#                             names:
#                               files: '{icons-folder}/*.png'
#
#                         The answer is the basenames found there.  A list
#                         is the several folders the plugin looks in, so
#                         write the ones the code searches and no others.
#                         A name is a setting of the plugin's or a dotted
#                         one in the config, and a pattern with one left
#                         over is skipped.  A value with a / in it is a
#                         path and is checked as one.
#
#     provides: [<what>, ...]
#                         beside names: providers, the questions the
#                         provider named here has to be able to answer -
#                         any one of them is enough.  A provider says
#                         which it answers with a provides: of its own,
#                         beside its settings:, and the words are the
#                         questions its role defines: map, frames,
#                         conditions, hourly, daily, text.  This is what
#                         tells a radar's frame-provider: from its
#                         base-provider:, which names: providers cannot.
#
# and must add:
#
#     help: <text>        what an editor shows beside it: whole sentences
#                         saying what it is, for somebody writing a config.
#                         Every type, setting and field in a block has one.
#
# of: is always type names and one-of: is always values, so neither has to
# be read in context.
#
# Silence means optional, and blank means none.  Those three - required,
# optional, inherited - are what a blank default cannot say by itself.

# what every type is built from
primitives: [number, string, boolean]

types:

  measure:
    is: scalar
    of: [string]
    help: A number with its unit written after it, such as 20px or 5280ft.
    # which units are legal comes from the setting's quantity:, or from Qt
    # where it has none.  Beside a bare number, a fraction of whatever
    # holds it.

  size:
    is: scalar
    of: [number, measure]
    help: How tall, as a fraction of the height of what it sits in, or as
      a measure such as 20px.
    # above 1 it was almost certainly meant as pixels, and the plugin says
    # so in the log

  font-size:
    is: scalar
    of: [number, measure]
    help: How tall the text is, as a fraction of the height of what it
      sits in, or as a measure such as 20px.  0 is as large as fits
      across.
    # 0 is what FitLabel is for

  color:
    is: scalar
    of: [string]
    help: A color name such as white, a hex color, or rgba().

  strftime:
    is: scalar
    of: [string]
    portable: true
    help: A time written in strftime's codes, such as %H:%M.  %-d drops a
      leading zero, on Windows too.
    # converted for Windows by strftimePortableFormat

  apikey:
    is: scalar
    of: [string]
    help: A service's key, or {apikeys.name} to take the one of that name
      from ApiKeys.yaml.
    # nothing can say whether a key is accepted without asking the
    # service, so what is checked is only that it is not plainly nothing -
    # blank, a name apikeys: does not have, or still the placeholder
    # examples/ApiKeys.yaml ships.

  provider:
    is: scalar
    of: [string]
    names: providers
    help: The name of one of the config's own providers.
    # a widget naming something else is a config that cannot work

  effects:
    is: scalar
    one-of: [glow, shadow, none]
    help: A glow, a drop shadow, or none.

  effect:
    # a glow or a drop shadow, which are one Qt effect with only the offset
    # telling them apart.  Widget.applyEffect reads it, so any widget takes
    # one; a plugin declaring effect: is giving itself a default rather than
    # claiming the setting.
    #
    # The string shorthand - 'glow 0.125 150', kind blur lighten - writes a
    # glow and cannot carry a color, because yaml reads a space then # as
    # a comment.
    is: block
    help: A glow or a drop shadow behind what a widget draws.  The short
      form, glow <blur> <lighten>, cannot name a color.
    of:
      type:
        is: effects
        help: Which effect, glow, shadow or none.
      blur:
        is: number
        help: How far the glow spreads, as a fraction of the region's
          height.
      color:
        is: color
        help: The glow's color.  Unset, it is the widget's own color,
          brightened.
      offset:
        is: number
        help: How far the glow is moved down and to the right, as a
          fraction of the region's height, which makes it a drop shadow.
      lighten:
        is: number
        help: How much the widget's own color is brightened for the glow,
          as a percentage.  100 leaves it as it is.

  location:
    is: block
    help: A place on the earth.
    of:
      latitude:
        is: number
        range: [-90, 90]
        required: true
        help: Degrees north of the equator, negative for south.
      longitude:
        is: number
        range: [-180, 180]
        required: true
        help: Degrees east of Greenwich, negative for west.
      timezone:
        is: string
        names: timezones
        help: The place's time zone, such as Europe/Oslo.  Blank is the
          machine's own.
      elevation:
        of: [number, measure]
        quantity: altitude
        help: How high the place is, in meters, or with a unit such as
          5280ft.  Blank lets a weather service work it out.
    # blank elevation is better than a guess, since a service works it out
    # from the coordinates.  A plugin reads what it has a use for.

  placement:
    # signed: a center is an offset from the middle, and a part may hang
    # above its region.  A side that would run past an edge is held at it.
    is: block
    help: Where a box sits inside the box holding it, each value a
      fraction of that one.
    of:
      left:
        is: number
        help: How far the left edge is from the left.
      right:
        is: number
        help: How far the right edge is from the right.
      top:
        is: number
        help: How far the top edge is from the top.
      bottom:
        is: number
        help: How far the bottom edge is from the bottom.
      horizontal-center:
        is: number
        help: How far the middle is from the middle, across.  Negative is
          to the left.
      vertical-center:
        is: number
        help: How far the middle is from the middle, down.  Negative is
          higher.

  geometry:
    # two of left/right/width give the third, and the same downward.
    # PiClock3._regionRect reads all of it, for a page's regions and a
    # widget's own parts alike - but something sized by its own contents,
    # a caption by its text, takes placement instead.
    is: block
    with: placement
    help: Where a box sits inside the box holding it, and how big it is,
      each value a fraction of that one.
    of:
      width:
        is: number
        help: How wide.
      height:
        is: number
        help: How tall.
      aspect:
        is: number
        range: [0.01, 100]
        help: The height as a multiple of the width, so 1.0 is square and
          2.0 twice as tall as wide.  It sets the height from the width,
          or the width from the height when no width is given.

  alignments:
    is: scalar
    one-of: [left-top, center-top, right-bottom, center]
    help: Where the words sit inside their box.  Unset, at the left and
      centered down the height.

  part:
    # a plugin names its own parts in a layout: block and says {is: part}
    # against each; Widget.part() builds them.
    #
    # Only the size: color and family arrive on the region and Qt inherits
    # them into whatever is drawn there.
    is: block
    with: geometry
    help: One box a widget draws inside its region, placed the way a
      layout places a region, but as fractions of the region.
    of:
      font-size:
        is: font-size
        help: How tall the text is, as a fraction of this box's height.
      align:
        is: alignments
        help: Where the words sit inside the box.
      wrap:
        is: boolean
        help: When true, a long line breaks onto the next.
