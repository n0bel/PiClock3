# What a layout file says: the boxes a page has and where they sit, and
# nothing about how they look.  Files are in layouts/, and a page names one.
#
# The region names here are what a widget's region: points at, so this file
# is the far end of that reference.

types:

  repeat:
    is: block
    help: One region divided into cells, named name.1, name.2 and on.  The
      bare name reaches all of them.
    # which is how a forecast fills nine cells from one entry
    of:
      count:
        is: number
        required: true
        help: How many cells.
      direction:
        is: scalar
        one-of: [down, across]
        help: Which way the cells run.
      gap:
        is: number
        help: The space left between cells, as a fraction of the region.

  border-name:
    is: scalar
    of: [string]
    names: borders
    help: The name of one of the theme's borders.

  style-name:
    is: scalar
    of: [string]
    names: styles
    help: The name of one of the theme's styles, or of this layout's
      layout-style-settings.

  region:
    is: block
    with: geometry
    help: A box on the page, placed as fractions of it.
    of:
      border:
        of: [boolean, border-name]
        help: A frame drawn around the region, by name.  true is the
          theme's default one.
      style:
        is: style-name
        help: Qt properties for the region, by name.
      repeat:
        is: repeat
        help: Divides the region into cells.

settings:

  name:
    is: string
    required: true
    help: The layout's name, as a page's layout names it.
  description:
    is: string
    help: What the layout is for, in a sentence.

  designed-for:
    is: string
    help: The shape of screen the layout was drawn for, such as '16:9' in
      quotes.  A screen of another shape is fitted rather than stretched.
  # quoted so yaml does not read it as a number

  regions:
    is: table
    of: region
    required: true
    help: The boxes on the page, by name.  A widget's region names one.

  layout-style-settings:
    is: table
    of: block
    help: What a style name means when the theme does not say.
  # a theme's styles: of the same name wins
