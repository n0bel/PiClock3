description: >
  OpenFreeMap, as the picture under a radar or the roads over one.  No key
  and no account, which is the whole point of it - the tiles are vector
  rather than finished images, so the cartography is drawn here and its
  colors are the theme's.  Attribution is required and is drawn into the
  map, so no config can leave it off.

provides: [map]

types:

  map-style:
    is: block
    of:
      from:       {is: string}
      layers:     {is: list, of: layer-group}
      background: {of: [map-ground, color]}
      palette:    {is: map-palette}
    # which cartography to take, which of its layers to keep, what sits
    # under them, and what color they end up.  Nothing here writes a
    # layer: every zoom-width curve and every filter stays the source
    # style's, which is what makes this worth doing rather than drawing
    # a map of our own.

  map-ground:
    is: scalar
    one-of: [none, relief, blue-marble]
    # what a background: may name instead of a color.  A ground is a
    # raster source and naming one substitutes it for the style's own,
    # so `relief` is Natural Earth used as the shape of the land and
    # `blue-marble` is NASA's photograph of it drawn as it arrives.
    # grounds.yaml is the list; adding one is an edit there and a name
    # here, and nothing else.

  layer-group:
    is: scalar
    one-of: [land, parks, water, water-names, boundaries, motorways,
             highways, roads, streets, paths, rail, bridges, shields,
             street-names, places, regions, localities,
             places-of-interest, buildings, airports]
    # groups rather than the source style's layer ids, because
    # road_trunk_primary_casing is not a thing a config should know.
    # Said in OpenMapTiles terms - a source layer and a feature the
    # layer's own filter is asked about - so the words reach any style
    # built on that schema rather than only the one they were cut from.
    # A set and never an order: layers draw in the source style's own
    # order whatever order they are named in, since that order is load
    # bearing.

  map-palette:
    is: block
    of:
      from:          {is: string, one-of: [dark, light]}
      land:          {is: color}
      land-high:     {is: color}
      water:         {is: color}
      park:          {is: color}
      boundary:      {is: color}
      road:          {is: color}
      road-casing:   {is: color}
      street:        {is: color}
      street-casing: {is: color}
      label:         {is: color}
      label-halo:    {is: color}
      shield:        {is: color}
      shield-text:   {is: color}
    # roles rather than layer ids, so a recolor does not have to know the
    # cartography either.  Which set it starts from comes from the
    # background's own luminance unless from: says.  Unlike layers:, a
    # role does name Liberty's layers underneath - a road and its casing
    # are the same class on the same source layer and only the id tells
    # them apart - so a palette reaches Liberty and what is cut from it.

settings:

  style: {of: [string, map-style]}
  # a shipped name - liberty, terrain, roads, light - one of theirs by
  # name, or a block.  A block merges tier by tier where a string
  # replaces, which is what lets a theme recolor without restating the
  # layer list.

  style-folders: {is: list, of: string}
  credit-color:  {is: color}
  credit-halo:   {is: color}
  font-family:   {is: string, inherits: page}
