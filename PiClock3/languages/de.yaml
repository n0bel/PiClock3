# Deutsch.  The words come from PiClock v1's Berlin configuration; the moon
# phases were never translated there and are here for the first time.

code: [de, deu, ger]

name: Deutsch

# LC_TIME names this language answers to, tried in order.  The
# spelling differs between platforms, and a glibc system has to
# have generated it (sudo dpkg-reconfigure locales), so several
# are offered and the first one that takes is used.
locale: [de_DE.UTF-8, de_DE.utf8, German_Germany.1252, de_DE]

date-format: '%A, {day}. %B %Y'

strings:
  pressure: Luftdruck
  humidity: Luftfeuchte
  wind: Wind
  gusting: in Böen
  feels_like: Gefühlt
  sunrise: Sonnenaufgang
  sunset: Sonnenuntergang
  moon_phase: Mondphase
  new_moon: Neumond
  waning_crecent: Abnehmende Sichel
  last_quarter: Letztes Viertel
  waning_gibbous: Abnehmender Dreiviertelmond
  full_moon: Vollmond
  waxing_gibbous: Zunehmender Dreiviertelmond
  first_quarter: Erstes Viertel
  waxing_crecent: Zunehmende Sichel
  today: Heute

  # what the almanac says where the sun does not rise or set
  polar_day:       Sonne geht nicht unter
  polar_night:     Kein Sonnenaufgang

# Conditions, as WMO code table 4678 - METAR present-weather notation.
# The key is the notation a provider reports; the comment is WMO's own
# English, which is a technical gloss rather than something to put on a
# screen, so every language including English is a translation of it.
#
# Nothing has to be complete.  A notation with no entry falls back to a
# less specific one - -SHRA to SHRA to RA - so a language is useful from
# its first dozen lines.

conditions:
  # sky cover - a separate METAR group, not in 4678
  'CAVOK':  Klar                         # ceiling and visibility OK
  'SKC':    Klar                         # sky clear, 0 oktas
  'CLR':    Klar                         # no cloud below 12 000 ft
  'NCD':    Klar                         # no cloud detected
  'NSC':    Heiter                       # no significant cloud
  'FEW':    Heiter                                   # few, 1 to 2 oktas
  'SCT':    Wolkig                                  # scattered, 3 to 4 oktas
  'BKN':    Stark bewölkt                         # broken, 5 to 7 oktas
  'OVC':    Bedeckt                      # overcast, 8 oktas
  'VV':     Himmel verdeckt              # vertical visibility, sky obscured
  # phenomena that only occur under a descriptor
  'GR':     Hagel                        # hail
  'GS':     Graupel                      # small hail and/or snow pellets
  'SH':     Schauer                      # shower(s)
  # WMO code table 4678, present weather
