# English.
#
# A language is one file: what to call it, and the words.  Files are found
# the way themes, layouts and units are found - languages/ of your own, or
# one a plugin brought with it, merges over what ships here.  So a plugin
# adds its own words without editing this, and you can change a word
# without editing a plugin.
#
# code: is the identity, under whichever standards name this language.  A
# config's language: is matched against every one of them, so en, eng or
# en-US all arrive here.  A language with no standard code can say
# anything, as long as nothing else claims it.

code: [en, eng]

name: English

# LC_TIME names this language answers to, tried in order.  The
# spelling differs between platforms, and a glibc system has to
# have generated it (sudo dpkg-reconfigure locales), so several
# are offered and the first one that takes is used.
locale: [en_US.UTF-8, en_US.utf8, English_United States.1252, en_US]

strings:
  pressure: Pressure
  humidity: Humidity
  wind: Wind
  gusting: Gusting
  feels_like: Feels Like
  sunrise: Sunrise
  sunset: Sunset
  moon_phase: Moon Phase
  new_moon: New Moon
  waning_crecent: Waning Crecent
  last_quarter: Last Quarter
  waning_gibbous: Waning Gibbous
  full_moon: Full Moon
  waxing_gibbous: Waxing Gibbous
  first_quarter: First Quarter
  waxing_crecent: Waxing Crecent
  today: Today

  # what the almanac says where the sun does not rise or set
  polar_day:       Sun Up All Day
  polar_night:     No Sunrise Today

# Conditions, as WMO code table 4678 - METAR present-weather notation.
# The key is the notation a provider reports; the comment is WMO's own
# English, which is a technical gloss rather than something to put on a
# screen, so every language including English is a translation of it.
#
# Nothing has to be complete.  A notation with no entry falls back to a
# less specific one - -SHRA to SHRA to RA - so a language is useful from
# its first dozen lines.

conditions:
  # sky cover - a separate METAR group, not in 4678
  'CAVOK':  Clear                        # ceiling and visibility OK
  'SKC':    Clear                        # sky clear, 0 oktas
  'CLR':    Clear                        # no cloud below 12 000 ft
  'NCD':    Clear                        # no cloud detected
  'NSC':    Fair                         # no significant cloud
  'FEW':    Mostly Clear                 # few, 1 to 2 oktas
  'SCT':    Partly Cloudy                # scattered, 3 to 4 oktas
  'BKN':    Mostly Cloudy                # broken, 5 to 7 oktas
  'OVC':    Overcast                     # overcast, 8 oktas
  'VV':     Sky Obscured                 # vertical visibility, sky obscured
  # phenomena that only occur under a descriptor
  'GR':     Hail                         # hail
  'GS':     Snow Pellets                 # small hail and/or snow pellets
  'SH':     Showers                      # shower(s)
