kind: basemap

# the trimmed styles are several times quicker to draw than liberty, their
# whole cartography.  A radar names its own style: and overrides this.
style: terrain

# the plugin's own styles/ is looked in last and needs no entry here
style-folders: []

# nothing is baked into a vector tile, so the credit their terms require is
# drawn here.  White on black reads against a light map or a dark one.
credit-color: '#ffffff'
credit-halo: '#000000'

# Qt's default, which is the one the rest of the clock uses
font-family: ''

# the clock's own language:, whose file lists the codes it answers to - so
# a German clock reads Hudson-Bucht without saying anything here
language: []
