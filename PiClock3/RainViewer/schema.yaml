description: >
  Radar frames from RainViewer, as timestamped tiles.  It fetches an index
  of what exists and answers from that, so its frame list is whatever the
  service last published.

provides: [frames]

settings:

  # MapLoop owns zoom: and hands a view to whoever it names.  Saying it
  # here narrows that rather than adding a zoom of our own: the service
  # stopped serving tiles above 7 and answers a "Zoom Level Not
  # Supported" card, which is a 200 and draws as a gray box.
  zoom:
    is: number
    range: [0, 7]
    help: How far in a map using RainViewer is drawn.  RainViewer serves
      nothing past 7.

  palette:
    is: number
    help: The color scheme the radar is drawn in, by the service's own
      number.
  smooth:
    is: number
    help: Set to 1 to blur the radar data smooth, or 0 to leave it as it
      is.
  snow:
    is: number
    help: Set to 1 to draw snow in colors of its own, or 0 not to.
  # the three the service takes in a tile's path.  Which palettes exist is
  # the service's to say rather than ours.
