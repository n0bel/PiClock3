description: >
  Radar frames from LibreWXR, as timestamped tiles.  Its frame list is
  arithmetic on a fixed interval rather than an index it has to fetch, so it
  can answer the moment it is asked.

provides: [frames]

settings:

  palette:
    is: number
    help: The color scheme the radar is drawn in, by the service's own
      number.
  smooth:
    is: number
    help: Set to 1 to blur the radar data smooth, or 0 to leave it as it
      is.
  snow:
    is: number
    help: Set to 1 to draw snow in colors of its own, or 0 not to.
  # the three the service takes in a tile's path.  Which palettes exist is
  # the service's to say rather than ours.
