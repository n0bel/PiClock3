description: >
  The date, in the language's own shape.  strftime localizes the names but
  never the order, so the sentence comes from the language rather than from
  here.

settings:

  format:
    is: string
    help: How the date is written, in strftime's codes.  {day} is the day
      with no leading zero, and {sup} the ordinal after it, such as st in
      1st.

  timezone:
    is: string
    names: timezones
    help: The zone whose date this shows, such as Europe/London.  Blank is
      the clock's own.
