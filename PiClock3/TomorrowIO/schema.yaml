description: >
  Tomorrow.io - what the sky is doing now, 120 hours of hourly forecast and
  six days of daily.  Needs a key; the free plan gives 500 requests a day
  and 25 an hour, which is what refresh: has to stay inside.

provides: [conditions, hourly, daily]

settings:

  apikey:
    is: apikey
    required: true
    help: Your Tomorrow.io key, usually {apikeys.tmapi} to take it from
      ApiKeys.yaml.
  refresh:
    is: number
    unit: minutes
    help: How often the conditions and forecast are fetched.  Each fetch
      spends two of the free plan's 25 requests an hour.
  forecast-days:
    is: number
    range: [1, 6]
    help: How many days to answer with, up to the 6 the free plan sends.
  location:
    is: location
    help: Where the forecast is for.  Unset, the clock's location.
