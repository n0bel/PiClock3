kind: digital-clock

# The face carries no color or font of its own.  The page's default: and
# anything a kind-setting says arrive through the region, and Qt inherits
# them - so a theme colors this clock by saying color once, and overrules
# it with kind-settings: {digital-clock: {color: ...}} when it wants this
# one different.

font-size: 0.3

# a blur that is a fraction of the region's height, so the halo is the
# same size on any screen.  Lighten is left at 150, where a pale color has
# clipped to white and a dark one has only brightened.
effect: glow 0.125

extra-font-attributes: ""

# the language's hour and minute, then the seconds and AM or PM on a second
# line
format: "{plugin-data.now:{language.time-format}\n%S %p}"

# a clock face reads better lowercased; a date does not
lowercase: true

# the clock's own, so a wall of them each name a city while one clock on a
# wall names none
timezone: '{location.timezone}'
