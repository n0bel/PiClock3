  'NCD':    Ciel dégagé                        # no cloud detected
  'NSC':    Beau temps                         # no significant cloud
  'FEW':    Peu nuageux                        # few, 1 to 2 oktas
  'SCT':    Nuageux                            # scattered, 3 to 4 oktas
  'BKN':    Très nuageux                       # broken, 5 to 7 oktas
  'OVC':    Couvert                            # overcast, 8 oktas
  'VV':     Ciel obscurci                      # vertical visibility, sky obscured
