pages:
  clock-page: {order: 0, layout: classic, theme: kevin}
  maps-page:  {order: 1, layout: bigmaps, theme: chris}

language: !include PiClock3/Language-en.yaml
locale:

location:
  lattitude: 45
  longitude: -93

# Providers supply data and occupy no region.
providers:
  weather-common: {plugin: PiClock3.WeatherCommon}

  # base map under the radar - needs a key in ApiKeys.yaml
  mapbox:     {plugin: PiClock3.Mapbox}
  googlemaps: {plugin: PiClock3.GoogleMaps}

  # radar tiles, one plugin per service.  Neither needs a key.  Point a
  # radar's frame-provider: at whichever of these you want.
  rainviewer: {plugin: PiClock3.RainViewer}
  librewxr:   {plugin: PiClock3.LibreWXR}

# Widgets occupy a region named by the page's layout, and draw in it.
widgets:
  clock:  {plugin: PiClock3.AnalogClock, region: clock}
# clock:  {plugin: PiClock3.DigitalClock, region: clock}
  date:   {plugin: PiClock3.Date,   region: date}
  astral: {plugin: PiClock3.Astral, region: bottom}

  current-conditions:
    plugin: PiClock3.Metar
    region: current
    METAR: KLVN

  radar1:
    plugin: PiClock3.MapLoop
    region: maps.1
    base-provider: mapbox
    frame-provider: librewxr
    zoom: 7
    center:
      lattitude: '{location.lattitude}'
      longitude: '{location.longitude}'
    markers:
      - location:
          lattitude: '{location.lattitude}'
          longitude: '{location.longitude}'
        color: red
        size: large
        image: teardrop-home

  radar2:
    plugin: PiClock3.MapLoop
    region: maps.2
    base-provider: mapbox
    frame-provider: librewxr
    zoom: 11
    center:
      lattitude: '{location.lattitude}'
      longitude: '{location.longitude}'
    markers:
      - location:
          lattitude: '{location.lattitude}'
          longitude: '{location.longitude}'
        color: green
        size: medium
        image: teardrop-home

  radar3:
    plugin: PiClock3.MapLoop
    region: radars.1
    base-provider: mapbox
    frame-provider: librewxr
    zoom: 7
    center:
      lattitude: '{location.lattitude}'
      longitude: '{location.longitude}'

  radar4:
    plugin: PiClock3.MapLoop
    region: radars.2
    base-provider: mapbox
    frame-provider: librewxr
    zoom: 11
    center:
      lattitude: '{location.lattitude}'
      longitude: '{location.longitude}'

folders:
  marker: PiClock3/markers

logging-level: debug

apikeys: !include ApiKeys.yaml
