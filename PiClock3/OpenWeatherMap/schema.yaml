description: >
  OpenWeather's free tier - what the sky is doing now, and 120 hours of
  forecast in three-hour steps.  Needs a key, which the free account gives
  for an email address and no card.  The days are rolled up here, since
  the daily grid belongs to the paid One Call plan.

provides: [conditions, hourly, daily]

settings:

  apikey:
    is: apikey
    required: true
    help: Your OpenWeather key, usually {apikeys.owmapi} to take it from
      ApiKeys.yaml.
  refresh:
    is: number
    unit: minutes
    help: How often the conditions and forecast are fetched.
  forecast-days:
    is: number
    range: [1, 6]
    help: How many days to answer with, up to the 6 the free tier's 120
      hours reach.
  location:
    is: location
    help: Where the forecast is for.  Unset, the clock's location.
