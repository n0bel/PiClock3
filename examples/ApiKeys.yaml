# Copy this to ApiKeys.yaml and fill in what you need.  ApiKeys.yaml is
# ignored by git, so your keys stay on your machine.
#
# The names are v1's, so a clock carried across can be pointed at the same
# ApiKeys.py values without renaming anything.

mbapi:     'YOUR API KEY FOR MAPBOX'  # https://account.mapbox.com
googleapi: 'YOUR API KEY FOR GOOGLE'  # https://console.cloud.google.com  (Static Maps)

# Weather needs no key at all unless you want one of these: Open-Meteo and
# METAR are free and unauthenticated, and are what the shipped examples use.
owmapi:    'YOUR APPID FOR OPENWEATHER'   # https://openweathermap.org/api  (free plan)
tmapi:     'YOUR API KEY FOR TOMORROW.IO' # https://app.tomorrow.io  (free plan)
