name: Meridian
description: Clock centered in the sun diagram, forecast in a row along the foot

# The classic layout stands the forecast up as a column on the right.  This
# lays it along the bottom instead, which leaves the middle of the screen
# whole - so a background with something in the middle of it, like the
# meridian theme's sun diagram, is not cut in half by a clock and a column.

provides: [current, model, maps, radar, clock, date, foot, forecast]

regions:

  # the observation and one radar, stacked at the left
  current:  {left: 0.0,  top: 0.09,   width: 0.21, height: 0.27}

  maps:     {left: 0.0,  top: 0.38,   width: 0.21, height: 0.28,
             border: radar}

  # the same weather from the other kind of source, so a station report and
  # a model can be read side by side
  model:    {right: 0.0, top: 0.09,   width: 0.21, height: 0.27}

  radar:    {right: 0.0, top: 0.38,   width: 0.21, height: 0.28,
             border: radar}

  # the clock sits in the middle of the diagram, where its dial belongs
  # aspect 1.0 measures the square off the width, so on a 16:9 screen a
  # third of the width is already two thirds of the height
  clock:    {width: 0.30, aspect: 1.0,
             horizontal-center: 0.0, vertical-center: -0.11}

  # six hours or days, read left to right along the foot
  forecast: {left: 0.0,  bottom: 0.07, width: 1.0, height: 0.20,
             border: true, repeat: {count: 6, direction: across, gap: 0.01}}

  date:     {left: 0.0,  top: 0.0,    width: 1.0, height: 0.09, style: date}
  foot:     {left: 0.0,  bottom: 0.0, width: 1.0, height: 0.07, style: foot}

# How big the text has to be to fit these regions.  A theme overrides any of
# it; carrying it here is what lets a layout look right under a theme that
# has never heard of it.
layout-style-settings:
  date:
    font-size: 0.62              # a fraction of the region's height
    qproperty-alignment: AlignCenter
  foot:
    font-size: 0.42
    qproperty-alignment: AlignCenter
