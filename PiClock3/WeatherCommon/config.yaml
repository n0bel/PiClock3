kind: weather
refresh: 10
icons-base-folder: '{plugin-folder}'
icons-folder: 'icons-lightblue'
# TODO: should come from the theme - Metar builds its own child labels and
# styles them explicitly rather than inheriting the page cascade
color: '#bef'
units:
  temperature: F    # F,C
  length: in        # in, mm, cm
  speed: mph        # mph, kph, mps, km/h, m/s
  direction: dir    # dir, deg
  rate: in/hr       # in/hr, mm/hr, cm/hr
  pressure: in      # in, mb, mm, hPa

  
