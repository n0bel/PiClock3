# What a theme file says: how a page looks, and nothing about where things
# sit.  A theme is a folder under themes/ holding theme.yaml and its art,
# and a page names one.
#
# Everything here is reachable from a config too, which has the last word -
# a theme is where an answer belongs, not where it is enforced.

types:

  border:
    is: block
    help: A frame drawn around a region, from a picture.
    of:
      art:
        is: string
        required: true
        help: The picture.  {this-folder} finds one beside the theme.
      width:
        is: number
        help: How thick the frame is, as a fraction of the screen's
          height.
      inset:
        is: number
        help: Where the region's contents start inside the frame, as a
          fraction of its width.  0.5 is the middle of the frame.

  slideshow:
    is: block
    help: Several pictures behind a page, one after another.
    # each theme ships its own background.png, so a slideshow across
    # themes has to name them
    of:
      folder:
        is: string
        help: A folder of pictures to show.
      files:
        is: list
        of: string
        help: Pictures to show, one by one.
      interval:
        is: number
        unit: seconds
        help: How long each picture is shown.
      order:
        is: scalar
        one-of: [sorted, shuffle]
        help: Whether the pictures come in name order, or shuffled.
      fit:
        is: scalar
        one-of: [cover, contain]
        help: With cover, the picture fills the page and is cropped.  With
          contain, all of it shows, with color around it.
      color:
        is: color
        help: The color around a picture that does not fill the page.

  qt-defaults:
    is: block
    help: What every widget on the page starts with.
    # only the five Qt names cascade, and only into a widget that declares
    # the name; font-size is here for the page itself, being a fraction of
    # whatever it lands in.
    of:
      color:
        is: color
        help: The text's color.
      background-color:
        is: color
        help: The color behind a widget.
      font-family:
        is: string
        help: The face text is drawn in.
      font-style:
        is: string
        help: Whether the text is normal, italic or oblique.
      font-weight:
        of: [string, number]
        help: How heavy the text is, normal, bold, or a number from 100 to
          900.
      font-size:
        is: font-size
        help: How tall the text is.
      # 300 arrives as a number and reaches the stylesheet as one, where it
      # is the weight between light and regular

settings:

  name:
    is: string
    required: true
    help: The theme's name.
  description:
    is: string
    help: What the theme looks like, in a sentence.

  default:
    is: qt-defaults
    help: What every widget on the page starts with.

  styles:
    is: table
    of: block
    help: Qt properties by name.  A layout region's style names one.

  borders:
    is: table
    of: border
    help: Frames by name.  A layout region's border names one, or true for
      the one called default.

  background:
    of: [string, slideshow]
    help: What is behind the page, a picture, a color, or a slideshow.

  kind-settings:
    is: table
    of: block
    help: Settings for every plugin of a kind, such as radar.
  plugin-settings:
    is: table
    of: block
    help: Settings for one plugin by name, such as PiClock3.MapLoop.
  # a kind means interchangeable with, so a kind-setting means the same
  # thing to each plugin wearing it.
