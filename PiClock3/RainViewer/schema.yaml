description: >
  Radar frames from RainViewer, as timestamped tiles.  It fetches an index
  of what exists and answers from that, so its frame list is whatever the
  service last published.

provides: [frames]

settings:

  # MapLoop owns zoom: and hands a view to whoever it names.  Saying it
  # here narrows that rather than adding a zoom of our own: the service
  # stopped serving tiles above 7 and answers a "Zoom Level Not
  # Supported" card, which is a 200 and draws as a gray box.
  zoom: {is: number, range: [0, 7]}

  palette: {is: number}
  smooth:  {is: number}
  snow:    {is: number}
  # the three the service takes in a tile's path.  smooth and snow are 0 or
  # 1; the palettes are the service's own numbering, and which exist is its
  # to say rather than ours.
