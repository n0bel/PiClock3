# French, as written in France.  Where France and Canada use different
# words for the same weather, this follows France: grésil is snow pellets
# here, and ice pellets are granules de glace.  Intensity follows what is
# falling, as Météo-France writes it: Pluie forte, not Forte pluie.
#
# Each condition keeps WMO's English gloss beside it, so an entry can be
# checked by someone who does not read French.

code: [fr, fra, fre]

name: Français

# LC_TIME names this language answers to, tried in order.  The
# spelling differs between platforms, and a glibc system has to
# have generated it (sudo dpkg-reconfigure locales), so several
# are offered and the first one that takes is used.
locale: [fr_FR.UTF-8, fr_FR.utf8, French_France.1252, fr_FR]

# mercredi 16 septembre 2026 - day and month names come lower-case from the
# locale, and only the first of the month takes an ordinal: 1er
date-format: '%A {day}<sup>{sup}</sup> %B %Y'
date-ordinal: {1: er}

# 15:05 - a 24-hour clock, since the locale has no AM or PM
time-format: '%H:%M'

# the sixteen points, keyed by the English abbreviation.  O for ouest,
# and the rest follow from it
compass: {N: N, NNE: NNE, NE: NE, ENE: ENE, E: E, ESE: ESE, SE: SE,
          SSE: SSE, S: S, SSW: SSO, SW: SO, WSW: OSO, W: O, WNW: ONO,
          NW: NO, NNW: NNO}

strings:
  pressure: Pression
  humidity: Humidité
  wind: Vent
  gusting: Rafales
  feels_like: Ressenti
  sunrise: Lever du soleil
  sunset: Coucher du soleil
  moon_phase: Phase de la lune
  new_moon: Nouvelle lune
  waning_crescent: Dernier croissant
  last_quarter: Dernier quartier
  waning_gibbous: Gibbeuse décroissante
  full_moon: Pleine lune
  waxing_gibbous: Gibbeuse croissante
  first_quarter: Premier quartier
  waxing_crescent: Premier croissant
  today: Aujourd'hui

  # what the almanac says where the sun does not rise or set
  polar_day:       Jour polaire
  polar_night:     Nuit polaire

