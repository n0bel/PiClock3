# PiClock3 - Berlin.
#
# PiClock v1 shipped a Berlin example; this is the same idea rebuilt.  It
# is the one that shows a clock does not have to be in English: language:
# picks the words, units: picks what things are measured in, and the
# timezone belongs to the place rather than to the machine.
#
# The coordinates are v1's, which are western Berlin, not anybody's house.

pages:
  clock-page: {order: 0, layout: classic, theme: circuit}
  maps-page:  {order: 1, layout: bigmaps, theme: circuit}

# the words the clock speaks - one of the codes a language file
# answers to.  Files ship in PiClock3/languages; a languages/ folder
# of your own, or a plugin's, adds to them.
language: de
# Day and month names come from the system, and the language file names the
# locales it answers to, so nothing is needed here.  Set locale: to override
# that.  On a Pi a locale has to exist first: sudo dpkg-reconfigure locales

location:
  latitude: 52.5074559
  longitude: 13.144557
  # the sunrise and sunset are Berlin's, wherever this runs
  timezone: Europe/Berlin

# what to show things in.  The sets ship in PiClock3/units; a units/ folder
# of your own, or a plugin's, can add more.
units: metric

# Providers supply data and occupy no region.
providers:

  # the daily forecast.  No key: Open-Meteo asks for none.
  openmeteo: {plugin: PiClock3.OpenMeteo}

  # an actual observation from a nearby field
  metar: {plugin: PiClock3.Metar, METAR: EDDB}   # Berlin Brandenburg

  # base map under the radar - needs a key in ApiKeys.yaml
  mapbox:     {plugin: PiClock3.Mapbox}
  googlemaps: {plugin: PiClock3.GoogleMaps}

  # radar tiles - one plugin per service, neither needs a key.  RainViewer
  # stopped serving tiles above zoom 7 and returns a "Zoom Level Not
  # Supported" card instead; LibreWXR still serves every zoom, so the
  # close-in radars below point at it.
  rainviewer: {plugin: PiClock3.RainViewer}
  librewxr:   {plugin: PiClock3.LibreWXR}

# Widgets occupy a region named by the page's layout, and draw in it.
# Settings for every widget of a kind, so the four radars below do not each
# repeat them.  An instance still has the last word, and a theme can carry
# the same block for anything that is a look rather than a choice.
kind-settings:
  radar:
    base-provider: mapbox        # or googlemaps, if that is the key you got
    frame-provider: librewxr     # or rainviewer

widgets:
  clock:  {plugin: PiClock3.AnalogClock, region: clock}
# clock:  {plugin: PiClock3.DigitalClock, region: clock}
  date:   {plugin: PiClock3.Date,   region: date}
  astral: {plugin: PiClock3.Astral, region: bottom}

  # one day in each cell of the layout's forecast column
  forecast:
    plugin: PiClock3.Forecast
    region: forecast
    forecast-provider: openmeteo

  # the strip along the bottom of the maps page
  maps-caption:
    plugin: PiClock3.DigitalClock
    region: caption
    format: "{plugin-data.now:%a %b} {plugin-data.now.day} {plugin-data.now.year}   {plugin-data.now:%H:%M:%S}"
    lowercase: false
    font-size: 0.75

  current-conditions:
    plugin: PiClock3.CurrentConditions
    region: current
    conditions-provider: metar

  radar1:
    plugin: PiClock3.MapLoop
    region: maps.1
    zoom: 7
    center:
      latitude: '{location.latitude}'
      longitude: '{location.longitude}'
    markers:
      - location:
          latitude: '{location.latitude}'
          longitude: '{location.longitude}'
        color: red
        size: large
        image: teardrop-home

  radar2:
    plugin: PiClock3.MapLoop
    region: maps.2
    zoom: 11
    center:
      latitude: '{location.latitude}'
      longitude: '{location.longitude}'
    markers:
      - location:
          latitude: '{location.latitude}'
          longitude: '{location.longitude}'
        color: green
        size: medium
        image: teardrop-home

  radar3:
    plugin: PiClock3.MapLoop
    region: radars.1
    zoom: 7
    center:
      latitude: '{location.latitude}'
      longitude: '{location.longitude}'

  radar4:
    plugin: PiClock3.MapLoop
    region: radars.2
    zoom: 11
    center:
      latitude: '{location.latitude}'
      longitude: '{location.longitude}'

folders:
  marker: PiClock3/markers

logging-level: debug

apikeys: !include ApiKeys.yaml
