name: London
description: The Thames at night, light-blue clock

# "London Skyline" by Sushant Sakhalkar, CC0 1.0, cropped to 1440x900.
# https://commons.wikimedia.org/wiki/File:London_Skyline_(199638369).jpeg
background: 'background.png'

kind-settings:
  analog-clock:       {clock-images-folder: lightblue}
  current-conditions: {icons-folder: icons-lightblue}
  forecast:           {icons-folder: icons-lightblue}

default:
  font-size: 0.02
  font-family: Arial
  background-color: transparent
  color: '#bef'

borders:
  default:
    art: 'frame.png'
    width: 0.012
    inset: 0.5
  radar:
    art: 'frame.png'
    width: 0.012
    inset: 0.5
