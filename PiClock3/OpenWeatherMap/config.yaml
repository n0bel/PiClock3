kind: forecast-source
apikey: '{apikeys.owmapi}'

# the free tier allows 60 calls a minute and a million a month, so this is
# politeness rather than a limit - the forecast behind it is recomputed
# hourly and asking oftener re-reads the same numbers.
refresh: 30

# the free tier sends 40 entries three hours apart - 120 hours from the
# next boundary - which crosses six local dates at every start time but
# midnight, the first and last of them being part days.  Six is what the
# forecast widget asks for.
forecast-days: 6

location:
    latitude: "{location.latitude}"
    longitude: "{location.longitude}"
