description: >
  A clock face with hands, drawn from four pictures - the face and three
  hands.  The hands are rotated, so each is drawn pointing at twelve.

settings:

  clock-images-folder:
    is: string
    help: The set of pictures the face and hands are drawn from.
  clock-images-base-folder:
    is: string
    help: The folder that holds the sets of clock pictures.
  # the base folder is a template so a theme can point it at {this-folder}
  # and carry a face of its own

  timezone:
    is: string
    names: timezones
    help: The zone this face shows, such as Europe/London.  Blank is the
      clock's own.
