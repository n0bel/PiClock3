# The shape of your Config.yaml - the document, rather than what any one
# plugin accepts.  A plugin's own settings are in its schema.yaml; this says
# where they go and what has to be around them.
#
# Types are the ones in core-types.yaml.  The three tables are tables
# because you invent the keys: a page, a provider and a widget are all named
# by you and referred to by that name elsewhere.

types:

  page:
    is: block
    help: One page of the clock, and the layout and theme it wears.
    of:
      order:
        is: number
        required: true
        help: Where this page comes as the pages turn, lowest first.
      layout:
        is: string
        names: layouts
        required: true
        help: The layout that says where this page's regions are.
      theme:
        is: string
        names: themes
        required: true
        help: The theme that says what this page looks like.
      dwell:
        is: number
        unit: seconds
        range: [0, 3600]
        help: How long this page stays before the next one turns in by
          itself.  0 waits to be turned, and unset is page-dwell.
    # order is what the pages step through, not what the file lists.  The
    # hour cap catches a MapLoop's milliseconds written here by habit

  provider-entry:
    is: block
    help: A plugin that fetches data and draws nothing, with its settings.
    of:
      plugin:
        is: string
        required: true
        help: Which plugin, such as PiClock3.OpenMeteo.
    # and whatever that plugin's schema.yaml declares, over its defaults

  widget-entry:
    is: block
    help: A plugin that draws in a region, with its settings.
    of:
      plugin:
        is: string
        required: true
        help: Which plugin, such as PiClock3.AnalogClock.
      region:
        of: [region-name, region-names]
        required: true
        help: The region it draws in, or a list of them.
    # and whatever that plugin's schema.yaml declares, plus everything in
    # widget-schema.yaml

  region-name:
    is: scalar
    of: [string]
    names: regions
    help: A region some page's layout declares.  A divided region's cells
      are maps.1, maps.2 and on, and the bare name reaches them all.

  region-names:
    is: list
    of: region-name
    help: Several regions, drawn in one after another.

  levels:
    is: scalar
    one-of: [debug, info, warning]
    help: How much the log says, from debug for everything to warning for
      trouble only.

  folder-list:
    is: list
    of: string
    help: Folders, looked in first to last.

  named-paths-block:
    is: block
    help: Folders of your own to look in, ahead of the PiClock3 folder's.
    of:
      base:
        of: [string, folder-list]
        help: A folder shaped like the PiClock3 folder, holding layouts,
          themes, plugins and the rest.
      layouts:
        of: [string, folder-list]
        help: A folder of layouts.
      themes:
        of: [string, folder-list]
        help: A folder of themes.
      plugins:
        of: [string, folder-list]
        help: A folder of plugins.  One found there is named by itself,
          such as Aurora rather than plugins.Aurora.
      languages:
        of: [string, folder-list]
        help: A folder of language files.
      units:
        of: [string, folder-list]
        help: A folder of units files.
      icons:
        of: [string, folder-list]
        help: A folder of icon sets.
    # the ones for one kind are looked in before base:

settings:

  pages:
    is: table
    of: page
    required: true
    help: The pages the clock has, by name.
  providers:
    is: table
    of: provider-entry
    help: Plugins that fetch data and draw nothing, by name.
  widgets:
    is: table
    of: widget-entry
    required: true
    help: Plugins that draw, each in a region, by name.
  apikeys:
    is: table
    of: string
    help: Your keys for the services that need one, usually
      !include ApiKeys.yaml.
  # so a key never sits in the file you would show somebody

  page-dwell:
    is: number
    unit: seconds
    range: [0, 3600]
    help: How long a page stays before the next one turns in by itself,
      for a page with no dwell of its own.  Unset or 0, pages wait to be
      turned.

  location:
    is: location
    required: true
    help: Where the clock is.  A plugin's own location defaults to this.
  language:
    is: string
    names: languages
    help: The language the clock speaks, such as fr.  Unset or system, the
      machine's own.
  locale:
    is: string
    help: The locale day and month names are taken from, over the one the
      language asks for.  Empty, the machine's.

  units:
    is: string
    names: unit-sets
    help: The set of units numbers are shown in, such as metric.  Unset,
      the language's own.

  logging-level:
    is: levels
    help: How much the log says.  Unset, info.
  # info, so a clock that is behaving oddly rather than raising still has
  # a log to attach to a bug report

  logging-to:
    is: string
    help: Where the log is written, folder and file name.  none writes no
      file, and unset is PyQtPiClock3.log in the PiClock3 folder.
  # a folder that is not there is made, and none still sends every line to
  # stderr

  logging-rotate:
    is: scalar
    one-of: [per-run, daily]
    help: When the log is started afresh, at every start of the clock or
      at midnight.
  logging-max-size:
    is: number
    unit: megabytes
    range: [0, 1000]
    help: How big the log grows before it is started afresh, under
      per-run.  0 is no limit.
  logging-keep:
    is: number
    range: [0, 100]
    help: How many old logs are kept.
  # daily does not roll on a restart, so a day's runs share a file

  geometry:
    is: string
    pattern: geometry
    help: A window of this size in place of the full screen, as 800x480,
      or 800x480+0+0 to place it too.
  # for looking at a clock built for a screen you do not have here

  start-at:
    is: string
    help: A date and time the clock starts at and runs on from, such as
      2026-12-21 13:45.  A radar still shows the current weather.

  kind-settings:
    is: table
    of: block
    help: Settings for every plugin of a kind, such as radar, over what a
      theme says.
  plugin-settings:
    is: table
    of: block
    help: Settings for one plugin by name, such as PiClock3.MapLoop, over
      what a theme says.

  layout:
    is: block
    help: Laid over the layout every page names, to try a change without
      editing the layout's file.
  theme:
    is: block
    help: Laid over the theme every page names, to try a change without
      editing the theme's file.
  # what is written here is read against that layout's or theme's schema
  # where it lands, so it is not restated here

  styles:
    is: table
    of: block
    help: Qt properties by name, for a layout region's style to name.  A
      theme's style of the same name wins.
  unit-sets:
    is: table
    of: block
    help: Sets of units of your own, by name.

  named-paths:
    is: named-paths-block
    help: Folders of your own to look in for layouts, themes, plugins,
      languages, units and icons.
  # all of it is optional, and a folder that is not there is a warning
  # rather than a stop

  folders:
    is: table
    of: string
    help: Deprecated, and still read.  A marker's image is looked for in
      folders.marker first.  Use a marker set, or a path in the image.
  # only a marker's image: ever read one - see WRITING-A-CONFIG.md
