pages:
  clock-page: {order: 0, layout: classic, theme: kevin}
  maps-page:  {order: 1, layout: bigmaps, theme: chris}
language: !include PiClock3/Language-en.yaml
locale:
location:
  lattitude: 45
  longitude: -93

plugins:
  clock: !include PiClock3/AnalogClock/config.yaml
#  clock: !include PiClock3/DigitalClock/config.yaml
  astral: !include PiClock3/Astral/config.yaml
  weather-common: !include PiClock3/WeatherCommon/config.yaml
  current-conditions: !include PiClock3/Metar/config.yaml
  current-conditions--:
    METAR: KLVN
  date: !include PiClock3/Date/config.yaml

  # base map under the radar - needs a key in ApiKeys.yaml
  mapbox: !include PiClock3/Mapbox/config.yaml
  googlemaps: !include PiClock3/GoogleMaps/config.yaml

  # radar tiles.  librewxr needs no key and has no zoom cap;
  # rainviewer is the same plugin pointed at a different index.
  librewxr: !include PiClock3/RainViewer/config.yaml
  librewxr--:
    index: https://api.librewxr.net/public/weather-maps.json
  rainviewer: !include PiClock3/RainViewer/config.yaml

  radar1: !include PiClock3/MapLoop/config.yaml
  radar1--:
    region: maps.1
    base-provider: mapbox
    frame-provider: librewxr
    zoom: 7
    center:
      lattitude: '{location.lattitude}'
      longitude: '{location.longitude}'
    markers:
      - location:
          lattitude: '{location.lattitude}'
          longitude: '{location.longitude}'
        color: red
        size: large
        image: teardrop-home

  radar2: !include PiClock3/MapLoop/config.yaml
  radar2--:
    region: maps.2
    base-provider: mapbox
    frame-provider: librewxr
    zoom: 11
    center:
      lattitude: '{location.lattitude}'
      longitude: '{location.longitude}'
    markers:
      - location:
          lattitude: '{location.lattitude}'
          longitude: '{location.longitude}'
        color: green
        size: medium
        image: teardrop-home

  radar3: !include PiClock3/MapLoop/config.yaml
  radar3--:
    region: radars.1
    base-provider: mapbox
    frame-provider: librewxr
    zoom: 7
    center:
      lattitude: '{location.lattitude}'
      longitude: '{location.longitude}'

  radar4: !include PiClock3/MapLoop/config.yaml
  radar4--:
    region: radars.2
    base-provider: mapbox
    frame-provider: librewxr
    zoom: 11
    center:
      lattitude: '{location.lattitude}'
      longitude: '{location.longitude}'

folders:
  marker: PiClock3/markers

logging-level: debug

apikeys: !include ApiKeys.yaml
