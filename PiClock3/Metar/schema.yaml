description: >
  A METAR station report - what the sky is actually doing at one airfield,
  rather than what a model expects.  Hourly, and no forecast of any kind.

provides: [conditions]

settings:

  METAR:
    is: string
    required: true
    help: The airfield's four-letter ICAO code, such as KMSP for
      Minneapolis.

  refresh:
    is: number
    unit: minutes
    help: How often the station's latest report is fetched.
