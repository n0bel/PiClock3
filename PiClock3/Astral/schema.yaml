description: >
  Sunrise, sunset and the moon phase, worked out rather than fetched.  It
  needs a latitude and a longitude and nothing else, which is why it is the
  one widget that is its own source.

settings:

  format:
    is: string
    help: The line drawn.  {plugin-data.sunrise}, {plugin-data.sunset}
      and {plugin-data.moonphase} are filled in, and the two times take a
      format such as {plugin-data.sunrise:%H:%M}.
  polar-format:
    is: string
    help: The line drawn instead on a day the sun neither rises nor
      sets.  {plugin-data.sun} names it, polar day or polar night.

  location:
    is: location
    help: The place the sun and moon are worked out for.  Unset, the
      clock's location.
