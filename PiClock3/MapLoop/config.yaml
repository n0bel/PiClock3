kind: radar

base-provider: ''
frame-provider: ''

center:
    latitude: '{location.latitude}'
    longitude: '{location.longitude}'
zoom: 7

interval: 10
frames: 7
frame-opacity: 1.0

overlay-style: ''
overlay-opacity: 1.0
overlay-provider: ''
dwell: 200
hold: 1200

markers: []

# two settings rather than one path, so a theme can name a set of its own
# and restyle the pins without touching anybody's locations
marker-images-folder: markers
marker-images-base-folder: '{plugin-folder}'

# a fraction of the map's height rather than a count of pixels, so a pin
# takes the same share of a small radar as of a large one
marker-size: 0.2

# none, which is right for a clock with only one map
label: ''
label-size: 0.10
label-color: '#bef'

# off, because the name sits in a corner a config chose, where a caption
# has to survive whatever the radar puts under it
label-outline: false

captions: []
caption-size: 0.06
caption-color: '#fff'

font-family: ''

# written the glibc way - %-I for a leading zero dropped - and converted
# for Windows here.  A list of your own carries its own formats inside its
# braces and ignores this.
caption-time-format: '%H:%M'

# false, because Mapbox and Google say their attribution must not be
# obscured.  true is also the way out if a provider's mark is somewhere
# this does not expect and the restored band covers weather for nothing.
ignore-attribution-mask: false
