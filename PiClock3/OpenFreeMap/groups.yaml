# The words a config uses for parts of a map, and what they mean.
#
# Two mappings.  `groups:` is what a style's layers: list picks from - one
# word for a part of the map, because road_trunk_primary_casing is not a
# thing anybody should have to know.  `roles:` is what a palette: recolors
# - one word for the layers that should end up the same color.
#
# A group is said in OpenMapTiles terms rather than in one style's layer
# ids.  A probe is a source layer and a feature, and a style layer joins
# the group when its own filter accepts that feature - so these words
# reach any style built on that schema, theirs and anybody else's, and
# they keep reaching it when a style is re-cut under new layer names.
#
#   layer:   the source layer, which is the schema's own word
#   type:    fill, line or symbol, where one source layer holds several
#   shape:   point, line or polygon, for a filter testing geometry-type.
#            All three when it is not said.
#   icon:    whether the layer draws an icon behind its text, which is
#            what tells a route shield from a road name
#   anything else is a feature attribute, and a list means every
#   combination of them - `class: [rail, transit]` beside
#   `brunnel: [bridge, tunnel]` is four features, and matching any one
#   of them joins.
#
# A group is a set and never an order.  Layers draw in the source style's
# own order whatever order they are named in, because that order is load
# bearing: Liberty draws every road casing before any road inner, so a
# layers: list that put motorways after roads and was obeyed would put
# dark casings over light road surfaces.  Writing the list chooses what is
# in, never what is on top.
#
# `background` and the relief raster are in no group at all, being what
# background: turns on rather than something to ask for.

groups:

  motorways:
    - {layer: transportation, type: line, shape: line,
       class: motorway, ramp: [0, 1]}

  highways:
    - {layer: transportation, type: line, shape: line,
       class: [trunk, primary], ramp: [0, 1]}

  roads:
    - {layer: transportation, type: line, shape: line,
       class: [secondary, tertiary], ramp: [0, 1]}

  # the road area fill and the one-way arrows come in here rather than
  # having groups of their own: they are minor-street furniture, and
  # neither is worth a word in a config.
  streets:
    - {layer: transportation, type: line, shape: line,
       class: [minor, street, street_limited, service, track], ramp: [0, 1]}
    - {layer: transportation, type: fill, shape: polygon}
    - {layer: transportation, type: symbol, shape: line, oneway: [1, -1]}

  paths:
    - {layer: transportation, type: line, shape: line,
       class: [path, pedestrian], ramp: [0, 1]}

  rail:
    - {layer: transportation, type: line, shape: line,
       class: [rail, transit]}

  # the bridge and tunnel variants of whatever roads are drawn.  One word
  # rather than a variant of each road group, because nobody wants bridges
  # for motorways and not for trunks.  A style separates them by the
  # brunnel attribute, so this is that attribute and every road class.
  bridges:
    - {layer: transportation, type: line, shape: line,
       brunnel: [bridge, tunnel], ramp: [0, 1],
       class: [motorway, trunk, primary, secondary, tertiary, minor,
               street, street_limited, service, track, path, pedestrian,
               rail, transit, link]}

  # a shield draws its number on a plate and a street name does not, and
  # the plate is an icon behind the text - which is the only thing in the
  # style that tells the two apart, both being symbol layers on the same
  # source layer.
  shields:
    - {layer: transportation_name, type: symbol, shape: line, icon: true,
       network: [us-interstate, us-highway, us-state, road], ref_length: 3}

  street-names:
    - {layer: transportation_name, type: symbol, shape: line, icon: false,
       class: [motorway, trunk, primary, secondary, tertiary, minor,
               street, service, track, path]}

  # settlements only.  A state name and a country name are their own
  # group and a radar wants neither: MINNESOTA in capitals across the
  # top of a map of Minnesota is not telling anybody anything, and the
  # rest - islands, neighborhoods - is a third group again.
  places:
    - {layer: place, type: symbol, shape: point,
       class: [city, town, village], capital: [0, 2], rank: 1}

  regions:
    - {layer: place, type: symbol, shape: point,
       class: [state, country], rank: [1, 2, 3], capital: 0}

  localities:
    - {layer: place, type: symbol, shape: point,
       class: [suburb, neighbourhood, quarter, hamlet, island,
               isolated_dwelling]}

  places-of-interest:
    - {layer: poi, type: symbol, shape: point, rank: [1, 7, 20],
       class: [airport, bus, rail, shop]}

  boundaries:
    - {layer: boundary, type: line, shape: line,
       admin_level: [2, 3], disputed: [0, 1]}

  water:
    - {layer: water, type: fill, shape: polygon}
    - {layer: waterway, type: line, shape: line,
       class: [river, stream, canal, ditch], brunnel: [none, tunnel]}

  water-names:
    - {layer: water_name, type: symbol}
    - {layer: waterway, type: symbol}

  parks:
    - {layer: park}
    - {layer: landuse, type: fill, shape: polygon, class: park}

  land:
    - {layer: landcover, type: fill, shape: polygon,
       class: [wood, grass, ice, wetland, sand, farmland, rock]}
    - {layer: landuse, type: fill, shape: polygon,
       class: [residential, commercial, industrial, suburb, pitch, track,
               cemetery, hospital, school, quarry, military]}

  buildings:
    - {layer: building}

  airports:
    - {layer: aeroway, type: fill, shape: polygon}
    - {layer: aeroway, type: line, shape: line, class: [runway, taxiway]}
    - {layer: aerodrome_label, type: symbol, shape: point, iata: MSP}


# Which paint key a role sets is the layer's own kind: fill-color on a
# fill, line-color on a line, text-color on a label - so a role names the
# layers that should agree about color and not what a color is called.
# The two -halo roles are the exception and say so.

roles:

  # motorway, trunk and primary only.  Secondary and tertiary are a tier
  # down and take `street`, which is how every road map anybody has seen
  # does it: one color for the roads you drive between towns on and
  # another for the ones inside them.
  road:
    layers: [road_motorway, road_motorway_link, road_trunk_primary,
             tunnel_motorway, tunnel_motorway_link, tunnel_trunk_primary,
             bridge_motorway, bridge_motorway_link, bridge_trunk_primary]

  road-casing:
    layers: [road_motorway_casing, road_motorway_link_casing,
             road_trunk_primary_casing, tunnel_motorway_casing,
             tunnel_motorway_link_casing, tunnel_trunk_primary_casing,
             bridge_motorway_casing, bridge_motorway_link_casing,
             bridge_trunk_primary_casing]

  street:
    layers: [road_secondary_tertiary, road_minor, road_link,
             road_service_track, road_path_pedestrian,
             tunnel_secondary_tertiary, tunnel_minor, tunnel_link,
             tunnel_service_track, tunnel_path_pedestrian,
             bridge_secondary_tertiary, bridge_street, bridge_link,
             bridge_service_track, bridge_path_pedestrian]

  street-casing:
    layers: [road_secondary_tertiary_casing, road_minor_casing,
             road_link_casing, road_service_track_casing,
             tunnel_secondary_tertiary_casing, tunnel_street_casing,
             tunnel_link_casing, tunnel_service_track_casing,
             bridge_secondary_tertiary_casing, bridge_street_casing,
             bridge_link_casing, bridge_service_track_casing,
             bridge_path_pedestrian_casing]

  water:
    layers: [water, waterway_river, waterway_other, waterway_tunnel]

  park:
    layers: [park, park_outline]

  land:
    layers: [landuse_residential, landcover_wood, landcover_grass,
             landcover_ice, landcover_wetland, landuse_pitch, landuse_track,
             landuse_cemetery, landuse_hospital, landuse_school,
             landcover_sand]

  boundary:
    layers: [boundary_3, boundary_2, boundary_disputed]

  label:
    layers: &labels [label_other, label_village, label_town, label_state,
                     label_city, label_city_capital, label_country_3,
                     label_country_2, label_country_1, water_name_point_label,
                     water_name_line_label, waterway_line_label,
                     highway-name-path, highway-name-minor,
                     highway-name-major, airport, poi_r20, poi_r7, poi_r1,
                     poi_transit]

  label-halo:
    paint: text-halo-color
    layers: *labels

  # a shield is drawn as its number over a halo, the sprite plate being
  # the one thing MapStyle does not draw - so the plate's color is the
  # halo's and the number's is its own
  shield-text:
    layers: &shields [highway-shield-non-us, highway-shield-us-interstate,
                      road_shield_us]

  shield:
    paint: text-halo-color
    layers: *shields
