description: >
  Open-Meteo's forecast - the hours ahead and the days ahead, and what it
  is doing now, in one request.  No key and no account.

provides: [conditions, hourly, daily]

settings:

  refresh:
    is: number
    unit: minutes
    help: How often the forecast is fetched.
  forecast-days:
    is: number
    range: [1, 16]
    help: How many days ahead to ask for, up to Open-Meteo's 16.
  location:
    is: location
    help: Where the forecast is for.  Unset, the clock's location.
