pages:
  clock-page: {order: 0, layout: classic, theme: circuit}
  maps-page:  {order: 1, layout: bigmaps, theme: circuit}

# the words the clock speaks - one of the codes a language file
# answers to.  Files ship in PiClock3/languages; a languages/ folder
# of your own, or a plugin's, adds to them.
language: en

location:
  latitude: 45
  longitude: -93
  # Blank means the machine's own zone, which is right when the clock
  # sits where it is pointed.  Name a zone when it does not.
  timezone:

# Providers supply data and occupy no region.
providers:

  # the daily forecast.  No key: Open-Meteo asks for none.
  openmeteo: {plugin: PiClock3.OpenMeteo}

  # an actual observation from a nearby field
  metar: {plugin: PiClock3.Metar, METAR: KLVN}

  # base map under the radar - needs a key in ApiKeys.yaml
  mapbox:     {plugin: PiClock3.Mapbox}
  googlemaps: {plugin: PiClock3.GoogleMaps}

  # radar tiles - one plugin per service, neither needs a key.  Point a
  # radar's frame-provider: at whichever you prefer.
  rainviewer: {plugin: PiClock3.RainViewer}
  librewxr:   {plugin: PiClock3.LibreWXR}

# Widgets occupy a region named by the page's layout, and draw in it.
widgets:
  clock:  {plugin: PiClock3.AnalogClock, region: clock}
# clock:  {plugin: PiClock3.DigitalClock, region: clock}
  date:   {plugin: PiClock3.Date,   region: date}
  astral: {plugin: PiClock3.Astral, region: bottom}

  # one day in each cell of the layout's forecast column
  forecast:
    plugin: PiClock3.Forecast
    region: forecast
    forecast-provider: openmeteo

  # the strip along the bottom of the maps page
  maps-caption:
    plugin: PiClock3.DigitalClock
    region: caption
    format: "{plugin-data.now:%a %b} {plugin-data.now.day} {plugin-data.now.year}   {plugin-data.now:%H:%M:%S}"
    lowercase: false
    font-size: 0.75

  current-conditions:
    plugin: PiClock3.CurrentConditions
    region: current
    conditions-provider: metar  # or openmeteo

  radar1:
    plugin: PiClock3.MapLoop
    region: maps.1
    base-provider: mapbox        # or googlemaps, if that is the key you got
    frame-provider: librewxr     # or rainviewer
    style: mapbox/satellite-streets-v10   # or hybrid if you're using googlemaps
    zoom: 7
    palette: 6
    smooth: 1
    snow: 1
    center:
      latitude: '{location.latitude}'
      longitude: '{location.longitude}'
    markers:
      - location:
          latitude: '{location.latitude}'
          longitude: '{location.longitude}'
        color: red
        image: teardrop-home

  radar2:
    plugin: PiClock3.MapLoop
    region: maps.2
    base-provider: mapbox        # or googlemaps, if that is the key you got
    frame-provider: librewxr     # or rainviewer
    style: mapbox/satellite-streets-v10   # or hybrid if you're using googlemaps
    zoom: 11
    palette: 6
    smooth: 1
    snow: 1
    center:
      latitude: '{location.latitude}'
      longitude: '{location.longitude}'
    markers:
      - location:
          latitude: '{location.latitude}'
          longitude: '{location.longitude}'
        color: green
        size: mid
        image: teardrop-home

  radar3:
    plugin: PiClock3.MapLoop
    region: radars.1
    base-provider: mapbox        # or googlemaps, if that is the key you got
    frame-provider: librewxr     # or rainviewer
    style: mapbox/satellite-streets-v10   # or hybrid if you're using googlemaps
    zoom: 7
    palette: 6
    smooth: 1
    snow: 1
    center:
      latitude: '{location.latitude}'
      longitude: '{location.longitude}'

  radar4:
    plugin: PiClock3.MapLoop
    region: radars.2
    base-provider: mapbox        # or googlemaps, if that is the key you got
    frame-provider: librewxr     # or rainviewer
    style: mapbox/satellite-streets-v10   # or hybrid if you're using googlemaps
    zoom: 11
    palette: 6
    smooth: 1
    snow: 1
    center:
      latitude: '{location.latitude}'
      longitude: '{location.longitude}'

logging-level: debug

apikeys: !include ApiKeys.yaml
